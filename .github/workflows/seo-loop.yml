# The monthly SEO loop (scripts/seo_loop.py): Search Console -> pages nearly on page one -> Claude
# drafts a better title, description and FAQs -> checked -> a pull request you merge with one tap,
# and a Telegram text with the link. Nothing goes live until you merge.
#
# Setup, once:
#   1. Google Cloud: a service account (no roles needed), enable "Google Search Console API" on its
#      project, and create a JSON key for it.
#   2. Search Console -> scalardigital.co.uk -> Settings -> Users and permissions -> Add user:
#      the service account's email, Restricted.
#   3. This repository -> Settings -> Secrets and variables -> Actions: GSC_SERVICE_ACCOUNT_JSON =
#      the whole key file. (ANTHROPIC_API_KEY and TELEGRAM_* are already there.)
#   4. Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
#      Without it you get a link to open the pull request yourself instead.
#
# Pull requests opened by this workflow don't start the Checks workflow (GitHub's rule for its own
# token), so the same lint, type check, tests and a full build run here before it's opened.
# This repository is public: the log and the pull request show page paths and counts only.
name: SEO loop

on:
  schedule:
    - cron: "23 5 1 * *"  # 1st of the month, early morning UK
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cryptography
      - name: Search Console and drafts
        id: loop
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python scripts/seo_loop.py run --out "$RUNNER_TEMP/seo"

      - if: steps.loop.outputs.changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.loop.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the site still builds
        if: steps.loop.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build

      - name: Open the pull request
        id: pr
        if: steps.loop.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="seo/$(date -u +%Y-%m)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/seo.json
          git commit -m "SEO loop: $(date -u +'%B %Y') search snippets"
          git push origin "$branch"
          python3 - "$branch" "$BASE" > "$RUNNER_TEMP/pr.json" <<'EOF'
          import json, os, sys
          from datetime import date
          summary = open(os.path.join(os.environ["RUNNER_TEMP"], "seo", "summary.md"), encoding="utf-8").read()
          body = (summary + "\n\nWritten by the monthly SEO loop (scripts/seo_loop.py): only `content/seo.json` changes. "
                  "Lint, type check, tests and a full build passed before this was opened. Merge to publish; close to skip.")
          print(json.dumps({"title": f"SEO loop: {date.today():%B %Y} search snippets", "head": sys.argv[1],
                            "base": sys.argv[2], "body": body}))
          EOF
          url=$(curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/pulls" --data @"$RUNNER_TEMP/pr.json" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])') \
            || url="https://github.com/$REPO/compare/$BASE...$branch?expand=1"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url"

      - name: Text the result
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/seo_loop.py notify --out "$RUNNER_TEMP/seo" --pr "${{ steps.pr.outputs.url }}"
      - name: Text the failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/seo_loop.py notify --out "$RUNNER_TEMP/seo" --error "the monthly run failed, nothing was changed"
